			 /* ===== CSS VARIABLES ===== */
    :root {
        --primary: #1A5276;
        --secondary: #3498DB;
        --accent: #2ECC71;
        --white: #FFFFFF;
        --light-gray: #F8F9FA;
        --medium-gray: #DEE2E6;
        --dark-gray: #6C757D;
        --text-dark: #2C3E50;
        --shadow-sm: 0 2px 8px rgba(0,0,0,0.1);
        --shadow-md: 0 4px 16px rgba(0,0,0,0.15);
        --radius: 12px;
        --transition: all 0.3s ease;
    }
    
    /* ===== RESET & BASE STYLES ===== */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    html, body {
        height: 100%;
        width: 100%;
        font-family: 'Nunito', sans-serif;
        color: var(--text-dark);
        background: var(--white);
        overflow-x: hidden;
    }
    
    /* ===== HEADER/NAVBAR STYLES ===== */
    .header {
        background: var(--white);
        box-shadow: var(--shadow-sm);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        width: 100%;
        height: auto;
    }
    
    .header-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 2rem;
        max-width: 1400px;
        margin: 0 auto;
    }
    
    /* Logo Section */
    .logo-section {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-shrink: 0;
    }
    
    .logo-kecamatan {
        width: 55px;
        height: 55px;
        border-radius: 10px;
        overflow: hidden;
        background: var(--white);
        border: 3px solid var(--white);
        box-shadow: var(--shadow-sm);
    }
    
    .logo-kecamatan img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 5px;
    }
    
    .logo-geoportal {
        display: flex;
        align-items: center;
        gap: 0.8rem;
    }
    
    .logo-icon {
        width: 45px;
        height: 45px;
        background: linear-gradient(135deg, var(--secondary), var(--primary));
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--white);
        font-size: 1.4rem;
        box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
    }
    
    .logo-text h1 {
        font-family: 'Poppins', sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--primary);
        line-height: 1.2;
        margin: 0;
    }
    
    .logo-text p {
        font-size: 0.8rem;
        color: var(--dark-gray);
        margin: 0;
        font-weight: 500;
    }
    
    /* Mobile Menu Toggle */
    .mobile-toggle {
        display: none;
        background: none;
        border: none;
        font-size: 1.5rem;
        color: var(--primary);
        cursor: pointer;
        padding: 0.5rem;
        border-radius: 8px;
        transition: var(--transition);
    }
    
    .mobile-toggle:hover {
        background: var(--light-gray);
    }
    
    /* Navigation */
    .navbar {
        flex-grow: 1;
        display: flex;
        justify-content: flex-end;
    }
    
    .nav-menu {
        display: flex;
        list-style: none;
        gap: 0.5rem;
        margin: 0;
        padding: 0;
    }
    
    .nav-item {
        position: relative;
    }
    
    .nav-link {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.7rem 1.2rem;
        text-decoration: none;
        color: var(--text-dark);
        background: transparent;
        border: 2px solid var(--medium-gray);
        border-radius: 30px;
        font-family: 'Poppins', sans-serif;
        font-weight: 600;
        font-size: 0.95rem;
        transition: var(--transition);
        white-space: nowrap;
    }
    
    .nav-link:hover {
        background: var(--secondary);
        color: var(--white);
        border-color: var(--secondary);
        transform: translateY(-2px);
        box-shadow: var(--shadow-sm);
    }
    
    .nav-link.active {
        background: var(--secondary);
        color: var(--white);
        border-color: var(--secondary);
    }
    
    /* Dropdown Menu */
    .dropdown-menu {
        position: absolute;
        top: 100%;
        left: 0;
        background: var(--white);
        min-width: 200px;
        border-radius: 10px;
        box-shadow: var(--shadow-md);
        padding: 0.5rem 0;
        opacity: 0;
        visibility: hidden;
        transform: translateY(10px);
        transition: var(--transition);
        z-index: 1001;
        list-style: none;
    }
    
    .dropdown:hover .dropdown-menu {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }
    
    .dropdown-item {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        padding: 0.7rem 1.2rem;
        color: var(--text-dark);
        text-decoration: none;
        transition: var(--transition);
        border-left: 3px solid transparent;
    }
    
    .dropdown-item:hover {
        background: var(--light-gray);
        color: var(--primary);
        border-left-color: var(--secondary);
        padding-left: 1.5rem;
    }
    
    .dropdown-item i {
        width: 18px;
        text-align: center;
        color: var(--dark-gray);
    }
    
    .dropdown-item:hover i {
        color: var(--secondary);
    }

    .page-wrapper {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding-top: 80px; /* Height of header */
    }
    
    .map-container {
        flex: 1;
        position: relative;
        width: 100%;
        height: calc(100vh - 80px);
    }
    
    #map {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }

    /* Tablet (768px - 1024px) */
    @media (max-width: 1024px) {

        }

            font-size: 1.3rem;
        }

            height: 40px;
            font-size: 1.2rem;

    /* Mobile (≤ 768px) */

        }
        
        .nav-menu {
            flex-direction: column;
            gap: 0.3rem;
            width: 100%;
        }
        
        .nav-link {
            width: 100%;
            border-radius: 8px;
            padding: 0.8rem 1rem;
            justify-content: flex-start;
        }
        
        /* Mobile Dropdown */
        .dropdown-menu {
            position: static;
            box-shadow: none;
            background: var(--light-gray);
            opacity: 1;
            visibility: visible;
            transform: none;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            margin: 0.3rem 0 0 1rem;
            border-radius: 8px;
            width: calc(100% - 2rem);
        }
        
        .dropdown.active .dropdown-menu {
            max-height: 300px;
        }
        
        .dropdown-arrow {

        }
        
        .dropdown.active .dropdown-arrow {

        }
        
        /* Map adjustments for mobile */

            padding-top: 130px; /* Increased for mobile header */
        }

        }

    /* Small Mobile (≤ 480px) */
    @media (max-width: 480px) {
        .header-container {

        .nav-link {

    /* Landscape Mode */
    @media (max-height: 500px) and (orientation: landscape) {
        .page-wrapper {

        }
        
        .map-container {
            height: calc(100vh - 70px);

    /* Print Mode */
    @media print {
        .header {

        }

            padding-top: 0;

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {

	<script>
// ===== UPDATE MAP HEIGHT FUNCTION =====
function updateMapHeight() {
    const header = document.querySelector('.header');
    const mapContainer = document.querySelector('.map-container');
    
    if (header && mapContainer) {
        const headerHeight = header.offsetHeight;
        const newHeight = `calc(100vh - ${headerHeight}px)`;
        
        // Update height
        mapContainer.style.height = newHeight;
        console.log('Map height updated:', newHeight, 'Header height:', headerHeight);
        
        // Update Leaflet map size jika map sudah diinisialisasi
        if (typeof map !== 'undefined' && map.invalidateSize) {
            setTimeout(() => {
                map.invalidateSize();
                console.log('Leaflet map resized');
            }, 200);
        }
    }
}

// ===== NAVBAR FUNCTIONALITY =====
document.addEventListener('DOMContentLoaded', function() {
    const mobileToggle = document.getElementById('mobileToggle');
    const navbar = document.getElementById('navbar');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const dropdown = document.querySelector('.dropdown');
    
    // Mobile Menu Toggle
    if (mobileToggle) {
        mobileToggle.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            navbar.classList.toggle('active');
            
            // Change icon
            const icon = this.querySelector('i');
            icon.className = navbar.classList.contains('active') 
                ? 'fas fa-times' 
                : 'fas fa-bars';
            
            // Update map height setelah navbar di-toggle
            setTimeout(updateMapHeight, 300);
        });
    }
    
    // Mobile Dropdown Toggle
    if (dropdownMenu) {
        dropdownMenu.addEventListener('click', function(e) {
            if (window.innerWidth <= 768) {
                e.preventDefault();
                e.stopPropagation();
                dropdown.classList.toggle('active');
            }
        });
    }
    
    // Close menus when clicking outside (mobile only)
    document.addEventListener('click', function(e) {
        if (window.innerWidth <= 768) {
            if (!e.target.closest('.navbar') && !e.target.closest('.mobile-toggle')) {
                navbar.classList.remove('active');
                if (mobileToggle) {
                    const icon = mobileToggle.querySelector('i');
                    icon.className = 'fas fa-bars';
                }
            }
            
            if (!e.target.closest('.dropdown')) {
                dropdown.classList.remove('active');
            }
        }
    });
    
    // Set active nav item
    setActiveNavItem();
    
    // Initial map height update
    updateMapHeight();
    
    // Window resize handler
    window.addEventListener('resize', function() {
        if (window.innerWidth > 768) {
            navbar.classList.remove('active');
            dropdown.classList.remove('active');
            if (mobileToggle) {
                const icon = mobileToggle.querySelector('i');
                icon.className = 'fas fa-bars';
            }
        }
        
        // Update map height on resize
        updateMapHeight();
    });
});

// Set active navigation item
function setActiveNavItem() {
    const currentPath = window.location.pathname;
    const navLinks = document.querySelectorAll('.nav-link');
    const dropdownItems = document.querySelectorAll('.dropdown-item');
    
    // Reset all
    navLinks.forEach(link => link.classList.remove('active'));
    dropdownItems.forEach(item => item.classList.remove('active'));
    
    // Check each nav link
    navLinks.forEach(link => {
        const href = link.getAttribute('href');
        if (href && href !== 'javascript:void(0)') {
            if (currentPath.includes(href) || 
                (href === '../' && (currentPath.endsWith('/') || currentPath.includes('index.html')))) {
                link.classList.add('active');
            }
        }
    });
    
    // Check dropdown items
    dropdownItems.forEach(item => {
        const href = item.getAttribute('href');
        if (href && currentPath.includes(href)) {
            item.classList.add('active');
        }
    });
}
</script>

	/* ===== TAMBAHKAN VARIABLES DI AWAL STYLE ===== */
:root {
    --primary: #1A5276;
    --secondary: #3498DB;
    --accent: #2ECC71;
    --light-bg: #F8F9FA;
    --light-card: #FFFFFF;
    --light-gray: #ECF0F1;
    --medium-gray: #BDC3C7;
    --dark-gray: #7F8C8D;
    --text-dark: #2C3E50;
    --text-light: #95A5A6;
    --white: #FFFFFF;
    --star-color: #FFD700;
    --star-empty: #E0E0E0;
    --border-radius: 12px;
    --shadow-subtle: 0 4px 12px rgba(0, 0, 0, 0.08);
    --shadow-medium: 0 6px 20px rgba(0, 0, 0, 0.12);
    --shadow-hover: 0 10px 30px rgba(0, 0, 0, 0.15);
}

/* ===== TAMBAHKAN STYLE UNTUK MAP ===== */
body {
    margin: 0;
    padding: 0;
    font-family: 'Nunito', sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* Container utama untuk map */
.map-wrapper {
    flex: 1;
    position: relative;
    width: 100%;
}

#map {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
}

/* Pastikan header tidak menutupi peta */
.header {
    position: relative; /* Ubah dari sticky untuk sementara */
    z-index: 1000;
}

/* Atur posisi peta agar tidak tertutup navbar */
body.has-navbar #map {
    top: 80px; /* Sesuaikan dengan tinggi navbar */
}

/* Untuk desktop - navbar sticky */
@media (min-width: 769px) {
    .header {
        position: sticky;
        top: 0;
    }
    
    #map {
        top: 80px; /* Tinggi navbar desktop */
        height: calc(100vh - 80px); /* Kurangi tinggi navbar */
    }
}

/* Untuk mobile */
@media (max-width: 768px) {
    .header {
        position: relative;
    }
    
    #map {
        top: 0;
        height: calc(100vh - 60px); /* Kurangi tinggi navbar mobile */
    }
}   
        .header {

    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;

.nav {

.nav a:hover {

}

.nav a.active {

}

/* ===== DROPDOWN MENU STYLES ===== */
.dropdown {
    position: relative;
    display: inline-block;
}

.dropdown-toggle {
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
}

.dropdown-icon {
    font-size: 0.8rem;
    transition: transform 0.3s ease;
}

.dropdown:hover .dropdown-icon {
    transform: rotate(180deg);
}

.dropdown-menu {
    position: absolute;
    top: 100%;
    left: 0;
    background-color: white;
    min-width: 220px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    border-radius: 10px;
    padding: 10px 0;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: all 0.3s ease;
    border: 1px solid #e1e8ed;
}

.dropdown:hover .dropdown-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.dropdown-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    color: #2C3E50;
    text-decoration: none;
    font-size: 0.95rem;
    transition: all 0.2s ease;
    border-left: 3px solid transparent;
}

.dropdown-item:hover {
    background-color: #f8f9fa;
    color: #1A5276;
    border-left-color: #3498DB;
    padding-left: 25px;
}

.dropdown-item i {
    width: 20px;
    text-align: center;
    color: #7F8C8D;
}

.dropdown-item:hover i {
    color: #3498DB;
}

.dropdown-item.active {
    background-color: #e3f2fd;
    color: #1A5276;
    border-left-color: #3498DB;
    font-weight: 600;
}

/* ===== RESPONSIVE NAVBAR ===== */

@media (max-width: 768px) {

    .dropdown {

		<script>
// JavaScript untuk navbar (dropdown mobile dan active state)
document.addEventListener('DOMContentLoaded', function() {
    // Untuk desktop: hover, untuk mobile: click
    const dropdowns = document.querySelectorAll('.dropdown');
    const dropdownToggles = document.querySelectorAll('.dropdown-toggle');
    
    if (window.innerWidth <= 768) {
        // Mobile behavior
        dropdownToggles.forEach(toggle => {
            toggle.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const dropdown = this.parentElement;
                dropdown.classList.toggle('active');
                
                // Close other dropdowns
                dropdowns.forEach(other => {
                    if (other !== dropdown) {
                        other.classList.remove('active');
                    }
                });
            });
        });
        
        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.dropdown')) {
                dropdowns.forEach(dropdown => {
                    dropdown.classList.remove('active');
                });
            }
        });
    }
    
    // Set active navigation item based on current page
    setActiveNavItem();
});

// Fungsi untuk set navigation item yang aktif
function setActiveNavItem() {
    const currentPath = window.location.pathname;
    const navLinks = document.querySelectorAll('.nav-link');
    const dropdownItems = document.querySelectorAll('.dropdown-item');
    
    // Reset all
    navLinks.forEach(link => link.classList.remove('active'));
    dropdownItems.forEach(item => item.classList.remove('active'));
    
    // Set active nav link
    navLinks.forEach(link => {
        const linkPath = link.getAttribute('href');
        
        // Check if current page includes the link path
        if (currentPath.endsWith(linkPath) || 
            (linkPath === '../' && (currentPath.endsWith('/') || currentPath.includes('index.html')))) {
            link.classList.add('active');
        }
    });
    
    // Set active dropdown item
    if (currentPath.includes('/Teluk/') || currentPath.includes('/teluk')) {
        document.querySelector('a[href*="teluk"]').classList.add('active');
    } else if (currentPath.includes('/Tanjung/') || currentPath.includes('/tanjung')) {
        document.querySelector('a[href*="Tanjung"]').classList.add('active');
    } else if (currentPath.includes('/PwtKidul/') || currentPath.includes('/pwtkidul')) {
        document.querySelector('a[href*="PwtKidul"]').classList.add('active');
    } else if (currentPath.includes('/PwtKulon/') || currentPath.includes('/pwtkulon')) {
        document.querySelector('a[href*="PwtKulon"]').classList.add('active');
    } else if (currentPath.includes('/Karangklesem/') || currentPath.includes('/karangklesem')) {
        document.querySelector('a[href*="Karangklesem"]').classList.add('active');
    } else if (currentPath.includes('/Karangpucung/') || currentPath.includes('/karangpucung')) {
        document.querySelector('a[href*="Karangpucung"]').classList.add('active');
    } else if (currentPath.includes('/Berkoh/') || currentPath.includes('/berkoh')) {
        document.querySelector('a[href*="Berkoh"]').classList.add('active');
    }
}

// Handle window resize
window.addEventListener('resize', function() {
    const dropdowns = document.querySelectorAll('.dropdown');
    
    if (window.innerWidth > 768) {
        // Desktop - remove active class
        dropdowns.forEach(dropdown => {
            dropdown.classList.remove('active');
        });
    }
});
</script>

        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }

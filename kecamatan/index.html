        <style>
        /* ===== VARIABLES ===== */
        :root {
            --primary: #1A5276;
            --secondary: #3498DB;
            --accent: #2ECC71;
            --light-bg: #F8F9FA;
            --light-card: #FFFFFF;
            --light-gray: #ECF0F1;
            --medium-gray: #BDC3C7;
            --dark-gray: #7F8C8D;
            --text-dark: #2C3E50;
            --white: #FFFFFF;
            --shadow-subtle: 0 4px 12px rgba(0, 0, 0, 0.08);
            --border-radius: 12px;
        }

        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            color: var(--text-dark);
            background: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER/NAVBAR ===== */
        .header {
            background: var(--light-card);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-subtle);
            border-bottom: 2px solid var(--light-gray);
            z-index: 1000;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-kecamatan {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border: 3px solid var(--white);
            background: var(--white);
        }

        .logo-kecamatan img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 5px;
        }

        .logo-geoportal {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-geoportal-icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            border-radius: 10px;
            color: var(--white);
            font-size: 1.8rem;
            box-shadow: 0 4px 8px rgba(52, 152, 219, 0.25);
        }

        .logo-geoportal-text {
            display: flex;
            flex-direction: column;
        }

        .logo-geoportal-main {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1.8rem;
            color: var(--primary);
            line-height: 1;
        }

        .logo-geoportal-tagline {
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--dark-gray);
            margin-top: 2px;
        }

        /* ===== NAVIGATION ===== */
        .nav {
            display: flex;
            gap: 10px;
        }

        .nav a {
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-dark);
            background: transparent;
            border: 2px solid var(--medium-gray);
            font-family: 'Poppins', sans-serif;
        }

        .nav a:hover {
            background: var(--secondary);
            color: var(--white);
            border-color: var(--secondary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-subtle);
        }

        .nav a.active {
            background: var(--secondary);
            color: var(--white);
            border-color: var(--secondary);
        }

        /* ===== DROPDOWN ===== */
        .dropdown {
            position: relative;
        }

        .dropdown-toggle {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dropdown-icon {
            font-size: 0.8rem;
            transition: transform 0.3s ease;
        }

        .dropdown:hover .dropdown-icon {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background: var(--white);
            min-width: 220px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            border-radius: 10px;
            padding: 10px 0;
            z-index: 1001;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            border: 1px solid var(--light-gray);
        }

        .dropdown:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: var(--text-dark);
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .dropdown-item:hover {
            background: var(--light-gray);
            color: var(--primary);
            border-left-color: var(--secondary);
            padding-left: 25px;
        }

        .dropdown-item i {
            width: 20px;
            text-align: center;
            color: var(--dark-gray);
        }

        /* ===== MAP CONTAINER ===== */
        .main-content {
            flex: 1;
            margin-top: 80px; /* Height of header */
            width: 100%;
            height: calc(100vh - 80px);
            position: relative;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .header {
                padding: 1rem 1.5rem;
            }
            
            .nav a {
                padding: 0.7rem 1.2rem;
                font-size: 0.95rem;
            }
            
            .logo-geoportal-main {
                font-size: 1.6rem;
            }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
                position: fixed;
            }
            
            .logo-container {
                width: 100%;
                justify-content: space-between;
            }
            
            .nav {
                flex-wrap: wrap;
                justify-content: center;
                width: 100%;
                gap: 8px;
            }
            
            .nav a {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
                flex: 1;
                min-width: 120px;
                justify-content: center;
            }
            
            /* Mobile dropdown */
            .dropdown-menu {
                position: static;
                box-shadow: none;
                background: var(--light-gray);
                opacity: 1;
                visibility: visible;
                transform: none;
                display: none;
                border-radius: 8px;
                margin-top: 5px;
            }
            
            .dropdown.active .dropdown-menu {
                display: block;
            }
            
            .dropdown-toggle {
                justify-content: space-between;
            }
            
            .dropdown-item {
                padding: 10px 15px;
                border-left: none;
                border-bottom: 1px solid var(--medium-gray);
            }
            
            .main-content {
                margin-top: 140px; /* Higher for mobile */
                height: calc(100vh - 140px);
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 0.8rem;
            }
            
            .logo-kecamatan {
                width: 50px;
                height: 50px;
            }
            
            .logo-geoportal-icon {
                width: 45px;
                height: 45px;
                font-size: 1.6rem;
            }
            
            .logo-geoportal-main {
                font-size: 1.4rem;
            }
            
            .nav {
                flex-direction: column;
            }
            
            .nav a {
                width: 100%;
            }
            
            .main-content {
                margin-top: 180px;
                height: calc(100vh - 180px);
            }
        }

        <script>
        // ===== NAVBAR MOBILE FUNCTION =====
        document.addEventListener('DOMContentLoaded', function() {
            const dropdowns = document.querySelectorAll('.dropdown');
            const dropdownToggles = document.querySelectorAll('.dropdown-toggle');
            
            // Mobile dropdown toggle
            if (window.innerWidth <= 768) {
                dropdownToggles.forEach(toggle => {
                    toggle.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        
                        const dropdown = this.parentElement;
                        dropdown.classList.toggle('active');
                        
                        // Close other dropdowns
                        dropdowns.forEach(other => {
                            if (other !== dropdown) {
                                other.classList.remove('active');
                            }
                        });
                    });
                });
                
                // Close dropdowns when clicking outside
                document.addEventListener('click', function(e) {
                    if (!e.target.closest('.dropdown')) {
                        dropdowns.forEach(dropdown => {
                            dropdown.classList.remove('active');
                        });
                    }
                });
            }
            
            // Active nav item
            setActiveNavItem();
            
            // Window resize
            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) {
                    dropdowns.forEach(dropdown => {
                        dropdown.classList.remove('active');
                    });
                }
                
                // Update map height
                updateMapHeight();
            });
            
            // Initial map height
            updateMapHeight();
        });
        
        function setActiveNavItem() {
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.nav-link');
            const dropdownItems = document.querySelectorAll('.dropdown-item');
            
            // Reset
            navLinks.forEach(link => link.classList.remove('active'));
            dropdownItems.forEach(item => item.classList.remove('active'));
            
            // Set active
            navLinks.forEach(link => {
                const linkPath = link.getAttribute('href');
                if (linkPath && currentPath.includes(linkPath)) {
                    link.classList.add('active');
                }
            });
            
            dropdownItems.forEach(item => {
                const itemPath = item.getAttribute('href');
                if (itemPath && currentPath.includes(itemPath)) {
                    item.classList.add('active');
                }
            });
        }
        
        function updateMapHeight() {
            const header = document.querySelector('.header');
            const mainContent = document.querySelector('.main-content');
            
            if (header && mainContent) {
                const headerHeight = header.offsetHeight;
                const mapHeight = window.innerHeight - headerHeight;
                
                mainContent.style.marginTop = headerHeight + 'px';
                mainContent.style.height = mapHeight + 'px';
                
                // Resize Leaflet map
                if (typeof map !== 'undefined' && map.invalidateSize) {
                    setTimeout(() => {
                        map.invalidateSize();
                    }, 100);
                }
            }
        }
        </script>

        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: 'rgba(255, 255, 0, 1.00)',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: 'rgba(255, 255, 0, 1.00)',
                fillOpacity: 1
              });
            }
            highlightLayer.openPopup();
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-7.477781860455539,109.2130682418961],[-7.405581473509368,109.27231049594974]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }

        var layer_GoogleSatellite_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleSatellite_0',

        });
        layer_GoogleSatellite_0;
        map.addLayer(layer_GoogleSatellite_0);
        function pop_Nama_DesaKarangpucungcopy_1(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['fid'] !== null ? autolinker.link(String(feature.properties['fid']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['id'] !== null ? autolinker.link(String(feature.properties['id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Nama'] !== null ? autolinker.link(String(feature.properties['Nama']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Luas'] !== null ? autolinker.link(String(feature.properties['Luas']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Jmlhpen'] !== null ? autolinker.link(String(feature.properties['Jmlhpen']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Nmapej'] !== null ? autolinker.link(String(feature.properties['Nmapej']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });

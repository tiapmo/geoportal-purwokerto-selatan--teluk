            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .export-btn-small:hover {

            color: var(--primary);
        }

        .big-map-container {
            padding: 2rem;

            align-items: center;
            min-height: 500px;

        .big-map-wrapper {

<style>
/* ===== VARIABLES ===== */
:root {
    --primary: #1A5276;
    --secondary: #3498DB;
    --accent: #2ECC71;
    --light-bg: #F8F9FA;
    --light-card: #FFFFFF;
    --light-gray: #ECF0F1;
    --medium-gray: #BDC3C7;
    --dark-gray: #7F8C8D;

    --text-light: #95A5A6;
    --white: #FFFFFF;
    --shadow-subtle: 0 4px 12px rgba(0, 0, 0, 0.08);
}

/* ===== HEADER STYLES (SAMA PERSIS DENGAN BERANDA) ===== */
.header {
    background-color: var(--light-card);
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--shadow-subtle);

    top: 0;
    z-index: 1000;
}

.logo-container {
    display: flex;
    align-items: center;
    gap: 20px;
}

.logo-kecamatan {
    width: 60px;
    height: 60px;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    border: 3px solid var(--white);
    background-color: var(--white);
}

.logo-kecamatan img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 5px;
}

.logo-geoportal {
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo-geoportal-icon {
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--secondary), var(--accent));
    border-radius: 10px;
    color: var(--white);
    font-size: 1.8rem;
    box-shadow: 0 4px 8px rgba(52, 152, 219, 0.25);
}

.logo-geoportal-text {
    display: flex;
    flex-direction: column;

.logo-geoportal-main {

.logo-geoportal-tagline {

.nav {

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Fungsi untuk mengatur menu aktif berdasarkan halaman saat ini
    function setActiveNav() {
        // Dapatkan path URL saat ini
        const currentPath = window.location.pathname;
        
        // Hapus class active dari semua link
        document.querySelectorAll('.nav a').forEach(link => {
            link.classList.remove('active');
        });
        
        // Tentukan halaman aktif berdasarkan path
        if (currentPath.includes('Kecamatan')) {
            // Jika berada di halaman Peta Kecamatan
            document.querySelector('.nav a[data-page="kecamatan"]').classList.add('active');
        } else if (currentPath.includes('teluk')) {
            // Jika berada di halaman Peta Desa Teluk
            document.querySelector('.nav a[data-page="desa"]').classList.add('active');
        } else if (currentPath.includes('tentang')) {
            // Jika berada di halaman Tentang Kami
            document.querySelector('.nav a[data-page="tentang"]').classList.add('active');
        } else {
            // Default: Beranda
            // Periksa jika berada di root atau beranda
            if (currentPath === '/' || currentPath.endsWith('index.html') || currentPath.endsWith('/') || currentPath.includes('beranda')) {
                document.querySelector('.nav a[data-page="beranda"]').classList.add('active');
            }
        }
        
        console.log('Path saat ini:', currentPath);
        console.log('Menu aktif:', document.querySelector('.nav a.active')?.textContent);
    }
    
    // Panggil fungsi saat halaman dimuat
    setActiveNav();
    
    // Jika menggunakan SPA atau ada perubahan URL tanpa reload
    // Tambahkan event listener untuk perubahan URL
    window.addEventListener('popstate', setActiveNav);
    
    // Opsional: Tambahkan event click untuk semua nav link untuk testing
    document.querySelectorAll('.nav a').forEach(link => {
        link.addEventListener('click', function(e) {
            // Hapus semua active class
            document.querySelectorAll('.nav a').forEach(item => {
                item.classList.remove('active');
            });
            // Tambahkan active class ke link yang diklik
            this.classList.add('active');
        });
    });
});
</script>

        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';

        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }

    <!-- JAVASCRIPT -->
    <script>
        // Zoom Functionality untuk Peta Kecamatan
        document.addEventListener('DOMContentLoaded', function() {
            const kecamatanMap = document.getElementById('kecamatanMap');
            const zoomInBtn = document.getElementById('zoomInBtn');
            const zoomOutBtn = document.getElementById('zoomOutBtn');
            const resetBtn = document.getElementById('resetBtn');
            
            let currentScale = 1;
            const minScale = 0.5;
            const maxScale = 3;
            const scaleStep = 0.2;
            
            // Zoom In
            zoomInBtn.addEventListener('click', function() {
                if (currentScale < maxScale) {
                    currentScale += scaleStep;
                    updateMapScale();
                }
            });
            
            // Zoom Out
            zoomOutBtn.addEventListener('click', function() {
                if (currentScale > minScale) {
                    currentScale -= scaleStep;
                    updateMapScale();
                }
            });
            
            // Reset
            resetBtn.addEventListener('click', function() {
                currentScale = 1;
                updateMapScale();
            });
            
            function updateMapScale() {
                kecamatanMap.style.transform = `scale(${currentScale})`;
                kecamatanMap.style.transformOrigin = 'center center';
                
                // Disable/enable buttons
                zoomInBtn.disabled = currentScale >= maxScale;
                zoomOutBtn.disabled = currentScale <= minScale;
            }
            
            // Mouse wheel zoom
            kecamatanMap.addEventListener('wheel', function(e) {
                e.preventDefault();
                if (e.deltaY < 0) {
                    // Scroll up - zoom in
                    if (currentScale < maxScale) {
                        currentScale += scaleStep;
                        updateMapScale();
                    }
                } else {
                    // Scroll down - zoom out
                    if (currentScale > minScale) {
                        currentScale -= scaleStep;
                        updateMapScale();
                    }
                }
            });
            
            // Drag functionality
            let isDragging = false;
            let startX, startY;
            let translateX = 0, translateY = 0;
            
            kecamatanMap.addEventListener('mousedown', function(e) {
                if (currentScale > 1) {
                    isDragging = true;
                    startX = e.clientX - translateX;
                    startY = e.clientY - translateY;
                    kecamatanMap.style.cursor = 'grabbing';
                }
            });
            
            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                
                translateX = e.clientX - startX;
                translateY = e.clientY - startY;
                
                kecamatanMap.style.transform = `scale(${currentScale}) translate(${translateX}px, ${translateY}px)`;
            });
            
            document.addEventListener('mouseup', function() {
                isDragging = false;
                kecamatanMap.style.cursor = currentScale > 1 ? 'grab' : 'default';
            });
            
            // Initialize
            updateMapScale();
        });
        </script>
